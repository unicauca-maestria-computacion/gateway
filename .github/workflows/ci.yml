name: CI/CD Practica Profesional gateway

on:
  push:
    branches: ['despliegue-de-pruebas']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          sed -i 's/\r$//' mvnw || true
          chmod +x mvnw || true
          ./mvnw clean package -DskipTests

      - name: Login Dockerhub
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t $DOCKER_USERNAME/practica-profesional-gateway:latest .
          docker push $DOCKER_USERNAME/practica-profesional-gateway:latest

  deploy:
    runs-on: self-hosted
    needs: build
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      BD_USER: ${{ secrets.BD_USER }}
      BD_PASSWORD: ${{ secrets.BD_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Create Docker Network
        run: |
          docker network create --driver bridge --opt com.docker.network.driver.mtu=1400 maestria-network || echo "Network already exists"

      - name: Free Host Memory Before DB Init
        run: |
          echo "--- Pruning stopped containers to recover host RAM ---"
          docker container prune -f || true
          echo "--- Stopping non-essential practica-u services temporarily ---"
          docker stop directory-service 2>/dev/null || true
          echo "--- Host memory after cleanup ---"
          free -h || true

      - name: Recreate MySQL Database Container
        run: |
          echo "Removing old mysql-db container and volume for fresh initialization..."
          docker rm -f mysql-db || true
          docker volume rm mysql_maestria_data || true
          echo "Creating fresh mysql-db container..."
          docker run -d \
            --name "mysql-db" \
            --network "maestria-network" \
            -p 3307:3306 \
            --restart "always" \
            --memory "1g" \
            --memory-swap "2g" \
            -e MYSQL_ROOT_PASSWORD="$BD_PASSWORD" \
            -e MYSQL_DATABASE="maestria-computacion" \
            -v mysql_maestria_data:/var/lib/mysql \
            mariadb:10.6 \
              --character-set-server=utf8mb4 \
              --collation-server=utf8mb4_unicode_ci \
              --innodb_buffer_pool_size=64M \
              --innodb_log_buffer_size=4M \
              --max-allowed-packet=128M \
              --net_write_timeout=600 \
              --net_read_timeout=600 \
              --log-error=/tmp/mariadb-error.log \
              --skip-name-resolve
          echo "Waiting for MariaDB initialization to complete (init process done)..."
          INIT_DONE=0
          for attempt in $(seq 1 36); do
            if docker logs mysql-db 2>&1 | grep -q "MariaDB init process done"; then
              echo "Init complete (attempt $attempt). Proceeding to wait for main server..."
              INIT_DONE=1
              break
            fi
            echo "Init not done yet (attempt $attempt/36), retrying in 5s..."
            sleep 5
          done
          if [ "$INIT_DONE" -eq 0 ]; then
            echo "ERROR: MariaDB init process did not complete in time."
            docker logs mysql-db
            exit 1
          fi
          echo "Waiting for main MariaDB server to accept connections..."
          READY=0
          for attempt in $(seq 1 12); do
            if docker exec mysql-db mysqladmin ping -uroot --silent 2>/dev/null; then
              READY=$((READY+1))
              echo "Ping $READY/2 OK (attempt $attempt)"
              if [ "$READY" -ge 2 ]; then break; fi
            else
              READY=0
              echo "Main server not ready (attempt $attempt/12), retrying in 5s..."
            fi
            sleep 5
          done
          if [ "$READY" -lt 2 ]; then
            echo "ERROR: Main MariaDB server did not become ready in time."
            docker logs mysql-db
            exit 1
          fi
          echo "Main MariaDB server is fully ready."

      - name: Initialize Database (Drop, Recreate, Run All Scripts)
        run: |
          run_sql() {
            local label="$1"
            local file="$2"
            echo "--- Running: $label ---"
            local tmp
            tmp=$(mktemp /tmp/sql_XXXXXX.sql)
            {
              echo 'SET FOREIGN_KEY_CHECKS=0; SET UNIQUE_CHECKS=0;'
              sed -E 's/check\([^)]+\)//gI; s/[[:space:]]VISIBLE\b//gI' "$file"
              echo 'SET FOREIGN_KEY_CHECKS=1; SET UNIQUE_CHECKS=1;'
            } > "$tmp"
            docker cp "$tmp" mysql-db:/tmp/current_script.sql
            rm -f "$tmp"
            docker exec mysql-db sh -c "mysql -uroot --max_allowed_packet=128M maestria-computacion < /tmp/current_script.sql" || true
            docker exec mysql-db rm -f /tmp/current_script.sql || true
            if ! docker exec mysql-db mysqladmin ping -uroot --silent 2>/dev/null; then
              echo "FATAL: MySQL server is down after running $label — capturing logs:"
              docker exec mysql-db cat /tmp/mariadb-error.log 2>&1 || true
              docker logs mysql-db --tail 80 2>&1 || true
              docker inspect mysql-db --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' 2>&1 || true
              exit 1
            fi
            echo "--- Done: $label ---"
          }

          echo "Dropping and recreating database..."
          docker exec mysql-db mysql -uroot -e "
            DROP DATABASE IF EXISTS \`maestria-computacion\`;
            CREATE DATABASE \`maestria-computacion\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER IF NOT EXISTS '$BD_USER'@'%' IDENTIFIED BY '$BD_PASSWORD';
            GRANT ALL PRIVILEGES ON \`maestria-computacion\`.* TO '$BD_USER'@'%';
            FLUSH PRIVILEGES;
          "
          echo "Running Base scripts..."
          run_sql "Base/1 - Schema principal" "Scripts/Base/1. SCRIPT_FINAL_BASE_DATOS_MAESTRIA_V3.sql"
          run_sql "Base/2 - Solicitudes"      "Scripts/Base/2. SCRIPT_SOLICITUDES V2.sql"
          run_sql "Base/3 - Documentos abrev" "Scripts/Base/3. Script_documentos_abreviados.sql"
          run_sql "Base/4 - Cert Voto"        "Scripts/Base/4. Script_Solicitud_Certificado_Voto.sql"
          echo "Running Nuevo scripts..."
          run_sql "Nuevo/1 - Matricula Academica"    "Scripts/Nuevo/1.Script_Matricula_Academica.sql"
          run_sql "Nuevo/2 - Matricula Financiera"   "Scripts/Nuevo/2.Script_Matricula_Financiera.sql"
          run_sql "Nuevo/3 - Info Presupuestaria"    "Scripts/Nuevo/3.Script_Info_Presupuestaria.sql"
          run_sql "Nuevo/4 - Revision Matricula"     "Scripts/Nuevo/4.Script_Solicitud_Revision_Matricula.sql"
          echo "Running test data scripts..."
          run_sql "Datos_Prueba - Students & Becas"  "Scripts/Datos_Prueba/INSERT_REAL_STUDENTS_AND_SIMULATE_BECAS.sql"
          echo "Database initialization complete."

      - name: Post-Failure Diagnostics
        if: always()
        run: |
          echo "=== HOST MEMORY ==="
          free -h || true
          echo "=== DOCKER PS (all containers) ==="
          docker ps -a || true
          echo "=== DOCKER STATS ==="
          docker stats --no-stream || true
          echo "=== MYSQL-DB CONTAINER STATE ==="
          docker inspect mysql-db --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' 2>&1 || true
          echo "=== MYSQL-DB CONTAINER LOGS (last 100 lines) ==="
          docker logs mysql-db --tail 100 2>&1 || true
          echo "=== KERNEL OOM MESSAGES ==="
          dmesg | grep -iE "oom|killed|out of memory" | tail -30 || true
          echo "=== DISK SPACE ==="
          df -h || true

      - name: Ensure Eureka Discovery Server is Running (directory)
        run: |
          if [ -z "$(docker ps -a -q -f name=directory-service)" ]; then
            echo "Creating and starting directory-service container..."
            docker run -d \
              --name "directory-service" \
              --network "maestria-network" \
              --network-alias "directory" \
              -p 8765:8761 \
              --restart "always" \
              --memory "256m" \
              --memory-swap "256m" \
              --label project="practica-u" \
              --label service="directory" \
              -e JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xms64m -Xmx192m" \
              $DOCKER_USERNAME/practica-profesional-directory:latest
          else
            echo "directory-service container exists, ensuring it is started..."
            docker start directory-service
          fi

      - name: Infrastructure Diagnosis & Cleanup
        run: |
          echo "--- DISK SPACE CHECK ---"
          df -h || true
          echo "--- CLEANING OLD CONTAINER ---"
          docker rm -f gateway-service || true

      - name: Pull Application Image (with Retry Logic)
        run: |
          echo "Attempting to pull image with auto-retry for stability..."
          for i in 1 2 3; do
            docker pull $DOCKER_USERNAME/practica-profesional-gateway:latest && exit 0 || \
            (echo "Attempt $i failed, waiting 10s..." && sleep 10)
          done
          echo "All pull attempts failed."
          exit 1

      - name: Run Application Container
        run: |
          docker run -d \
            --name "gateway-service" \
            --network "maestria-network" \
            --network-alias "gateway" \
            -p 8081:8081 \
            --restart "always" \
            --memory "256m" \
            --memory-swap "256m" \
            --label project="practica-u" \
            --label service="gateway" \
            -e SPRING_PROFILES_ACTIVE="dev" \
            -e EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE="http://directory:8761/eureka/" \
            -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://directory:8761/eureka/" \
            -e JWT_SECRET="mySecretKeyForTestingDeploymentOfPracticaU2026!!!" \
            -e JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xms64m -Xmx192m" \
            $DOCKER_USERNAME/practica-profesional-gateway:latest

      - name: Clean Old Images of This Service
        run: |
          echo "Cleaning old images for gateway service..."
          CURRENT_IMAGE=$(docker inspect gateway-service --format='{{.Image}}' 2>/dev/null || echo "")
          if [ -n "$CURRENT_IMAGE" ]; then
            docker images --filter "label=service=gateway" --format "{{.ID}}" | while read img; do
              if [ "$img" != "${CURRENT_IMAGE:7:12}" ]; then
                echo "Removing old image: $img"
                docker rmi -f $img 2>/dev/null || true
              fi
            done
          fi
          docker images $DOCKER_USERNAME/practica-profesional-gateway --format "{{.ID}} {{.Tag}}" | grep -v "latest" | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true

      - name: Clean Stopped Containers of This Service
        run: |
          echo "Cleaning stopped containers for gateway service..."
          docker ps -a --filter "label=service=gateway" --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true

      - name: Final Status Check
        run: |
          sleep 5
          docker ps | grep gateway-service || true
          echo "--- LAST 20 LINES OF LOGS ---"
          docker logs --tail 20 gateway-service || true
